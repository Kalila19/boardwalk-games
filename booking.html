<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore Boardwalk Games' vast library of engaging and exciting board games available for rent or purchase. 
      Reserve your game online and embark on your next board game adventure today!"
    />
    <title>Boardwalk Games | Game Library</title>

    <!-- favicons generated by favicon.io -->

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/images/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/images/favicon-16x16.png"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <!-- CSS code -->
    <link rel="stylesheet" href="assets\css\styles.css" />
    <title>Boardwalk Projects</title>
  </head>
  <!-- Classes on body set to work with mt-auto on footer to ensure it always stays at the bottom of the page -->
  <body class="d-flex flex-column min-vh-100">
    <!-- used to create a flexbox container for the column-->
    <!-- Navigation -->
    <nav id="navbar" class="navbar navbar-expand-lg" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" href="#"
          ><img
            src="assets\images\logo-sm-white.png"
            alt="Boardwalk Games logo"
            class="logo"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Services</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="game-library.html"
                >Games</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#contact">Contact</a>
            </li>
            <li class="nav-item">
                <a href="booking.html" aria-current="page" class="btn btn-primary ms-lg-3"></a>Book now</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>


   
    <!-- Footer / Contact section -->

    <footer id="contact" class="mt-auto">
      <!-- margin-top-auto is used to push the footer to the bottom of the page -->
      <div class="container section">
        <div class="row justify-content-center">
          <!-- it will center the columns -->
          <div class="col-12 text-center">
            <h2 class="display-6">Contact Us!</h2>
          </div>
          <!-- contact info -->
          <div class="col-12 col-md-6 col-xl-4">
            <h3 class="sub-heading-color">Contact Info</h3>
            <address>
              <strong
                ><i class="fa-solid fa-location-dot"></i> Boardwalk
                Games</strong
              ><br />
              123 Boardwalk<br />
              Boardwalk City, 12345
            </address>
            <p>
              <i class="fa-solid fa-phone"></i> 012 345 6789<br />
              <i class="fa-regular fa-paper-plane"></i>
              info@boardwalk-games.co
            </p>

            <div class="social-links my-4">
              <a
                href="https://www.facebook.com"
                target="_blank"
                rel="noopener"
                aria-label="Visit our facebook page (opens in a new tab)"
                ><i class="fa-brands fa-square-facebook"></i
              ></a>
              <a
                href="https://www.instagram.com"
                target="_blank"
                rel="noopener"
                aria-label="Visit our Instagram page (opens in a new tab)"
                ><i class="fa-brands fa-instagram"></i
              ></a>
              <a
                href="https://www.x.com"
                target="_blank"
                rel="noopener"
                aria-label="Visit our X page (opens in a new tab)"
                ><i class="fa-brands fa-x-twitter"></i
              ></a>
            </div>
          </div>
          <!-- opening times -->
          <div class="col-12 col-md-6 col-xl-4">
            <h2 class="sub-heading-color">Opening Times</h2>
            <table class="table table-dark">
              <thead>
                <tr>
                  <th scope="col">Day</th>
                  <th scope="col">Open</th>
                  <th scope="col">Close</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <th scope="row">Mon</th>
                  <td>Closed</td>
                  <td></td>
                </tr>
                <tr>
                  <th scope="row">Tue-Thur</th>
                  <td>11am</td>
                  <td>11pm</td>
                </tr>
                <tr>
                  <th scope="row">Fri-Sat</th>
                  <td>11am</td>
                  <td>12am</td>
                </tr>

                <tr>
                  <th scope="row">Sun</th>
                  <td>12pm</td>
                  <td>7pm</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </footer>
    <!-- Bootstrap JS-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>

    <!-- Font Awesome Kit  -->
    <script
      src="https://kit.fontawesome.com/b3def77d97.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
